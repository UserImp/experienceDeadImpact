<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltimaThule Clan XP</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: radial-gradient(circle at center, #1e1e30 0%, #0f0f15 100%); 
            color: #fff; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        
        /* Более собранная, аккуратная карточка без вытянутости */
        .calc-card { 
            background: linear-gradient(145deg, #1a1528, #130f1e); 
            padding: 22px; 
            border-radius: 16px; 
            border: 2px solid #a855f7; 
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.15); 
            width: 100%; 
            max-width: 440px; /* Немного сузили, чтобы пропорции были идеальными */
            box-sizing: border-box; 
            position: relative; 
            transition: all 0.3s ease; 
        }
        .calc-card:hover { 
            box-shadow: 0 12px 40px rgba(168, 85, 247, 0.5), inset 0 0 20px rgba(168, 85, 247, 0.25); 
        }
        
        h2 { text-align: center; color: #ffcc00; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; font-size: 18px; text-shadow: 0 0 8px rgba(255,204,0,0.3); margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; color: #a2a3b5; font-size: 13px; font-weight: 600; letter-spacing: 0.3px; }
        
        /* Красивые скругленные поля уменьшенной высоты */
        input { width: 100%; padding: 0 15px; border-radius: 10px; border: 2px solid #3c1e5c; background: #0f0b18; color: #fff; box-sizing: border-box; font-size: 14px; font-weight: 600; transition: all 0.2s; height: 44px; line-height: 40px; text-align: center; }
        input:focus { border-color: #a855f7; outline: none; box-shadow: 0 0 8px rgba(168,85,247,0.3); background: #130d22; }
        input:disabled, .checkbox-container input:disabled { background: #090610; color: #434456; border-color: #1a1528; cursor: not-allowed; }
        
        .custom-select-wrapper { position: relative; width: 100%; user-select: none; }
        .custom-select { display: flex; align-items: center; justify-content: center; background: #0f0b18; border: 2px solid #3c1e5c; padding: 0 15px; border-radius: 10px; cursor: pointer; color: #787991; font-size: 14px; font-weight: 600; transition: all 0.3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 44px; box-sizing: border-box; line-height: 40px; position: relative; }
        .custom-select::after { content: '▲'; font-size: 9px; color: #a2a3b5; transition: transform 0.3s; flex-shrink: 0; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); }
        .custom-select-wrapper.open .custom-select { border-color: #a855f7; color: #fff; background: #130d22; }
        .custom-select-wrapper.open .custom-select::after { transform: rotate(180deg) translateY(50%); }
        
        .custom-options { display: none; position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: #0f0b18; border: 2px solid #3c1e5c; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 100; max-height: 280px; overflow-y: auto; padding: 5px 0; }
        .custom-select-wrapper.open .custom-options { display: block; }
        .custom-option { padding: 10px 15px; cursor: pointer; display: block; font-weight: 600; font-size: 13px; border-bottom: 1px solid rgba(60,30,92,0.3); transition: background 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
        .custom-option:last-child { border-bottom: none; } .custom-option:hover { background: rgba(168,85,247,0.15); }
        
        .rank-rec { color: #ff4b4b; } .rank-fight { color: #b4cde6; } .rank-off { color: #ffd000; } .rank-sens { color: #f492be; } .rank-treas { color: #00e65b; } .rank-grind { color: #ff8400; } .rank-hero { color: #df6aff; } .rank-unknown { color: #fff; font-style: italic; }
        
        /* Компактные подложки для блоков */
        .rank-training-plate { display: flex; gap: 12px; background: rgba(15, 11, 24, 0.7); padding: 12px; border-radius: 10px; border: 1px solid #3c1e5c; margin-bottom: 14px; align-items: flex-end; }
        .plate-item { flex: 1; display: flex; flex-direction: column; min-width: 0; justify-content: flex-end; } 
        .plate-item label { color: #ffcc00; margin-bottom: 6px; }
        
        .info-note { font-size: 12px; color: #a2a3b5; margin-bottom: 14px; padding: 10px 12px; background: rgba(15, 11, 24, 0.4); border-radius: 8px; border: 1px dashed #3c1e5c; line-height: 1.5; box-sizing: border-box; min-height: 48px; display: flex; align-items: center; }
        .info-note span { color: #ffcc00; font-weight: bold; } .info-note .stat-block { width: 100%; } .info-note .stat-line { display: flex; justify-content: space-between; margin-bottom: 2px; } .info-note .stat-line:last-child { margin-bottom: 0; }
        .info-note .green-val { color: #00e65b; } .info-note .red-val { color: #ff4b4b; }
        .info-note .angry-fox { color: #f43f5e; font-weight: 600; text-align: center; width: 100%; display: block; line-height: 1.4; }
        
        .unity-plate { display: flex; gap: 12px; background: rgba(15, 11, 24, 0.7); padding: 12px; border-radius: 10px; border: 1px solid #3c1e5c; margin-bottom: 14px; align-items: flex-end; transition: all 0.3s; box-sizing: border-box; }
        .unity-plate.active { border-color: #a855f7; box-shadow: 0 0 10px rgba(168, 85, 247, 0.1); } 
        .checkbox-container { display: flex; align-items: center; gap: 8px; flex: 1.5; min-width: 0; height: 44px; }
        .checkbox-container input { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; margin: 0; border-radius: 4px; } 
        .checkbox-container label { margin-bottom: 0; cursor: pointer; color: #fff; font-size: 13px; font-weight: 600; line-height: 1.2; text-align: left; }
        .unity-input-container { flex: 1; display: flex; flex-direction: column; min-width: 0; justify-content: flex-end; } 
        .unity-input-container label { font-size: 11px; color: #a2a3b5; margin-bottom: 6px; }
        .unity-input-container label.active-label { color: #ffcc00; font-weight: 600; }
        
        /* Красивое неоновое окно результата */
        .result { background: linear-gradient(180deg, #0f0b18, #090610); padding: 16px; border-radius: 10px; border-left: 5px solid #a855f7; margin-top: 20px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        .result-label { font-size: 13px; color: #a2a3b5; font-weight: 600; } .value-container { position: relative; display: flex; align-items: center; margin-top: 8px; min-height: 38px; }
        .result-val { font-size: 28px; font-weight: bold; color: #d8b4fe; text-shadow: 0 0 8px rgba(168, 85, 247, 0.6), 0 0 20px rgba(147, 51, 234, 0.4); position: relative; z-index: 2; }
        .result-val.error-msg { font-size: 15px; color: #f43f5e; text-shadow: 0 0 6px rgba(244,63,94,0.5); }
        .fox-icon { position: absolute; bottom: -12px; right: 5px; z-index: 1; width: 44px; height: 44px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .result:hover .fox-icon { transform: translateY(-8px) scale(1.05); }
        .credits-footer { text-align: center; margin-top: 22px; font-size: 12px; color: #787991; line-height: 1.6; font-weight: 500; border-top: 1px solid rgba(60, 30, 92, 0.3); padding-top: 12px; }
        .credits-footer .clan-name { color: #ffd000; font-weight: 600; text-shadow: 0 0 6px rgba(255,208,0,0.2); }
        .credits-footer .project-name { color: #00e65b; font-weight: 600; text-shadow: 0 0 6px rgba(0,230,91,0.2); }
        @media (max-width: 440px) { .rank-training-plate, .unity-plate { flex-direction: column; align-items: stretch; gap: 10px; padding: 10px; } .checkbox-container { height: auto; padding: 4px 0; } }
    </style>
</head>
<body>
<div class="calc-card">
    <h2>🆙 Калькулятор опыта клана</h2>
    <div class="form-group">
        <label for="baseExp">Полученный опыт:</label>
        <input type="number" id="baseExp" value="" placeholder="Введи опыт." oninput="calculateExp(false)">
    </div>
    <div class="rank-training-plate">
        <div class="plate-item" style="flex: 1.6;">
            <label>Моё звание:</label>
            <div class="custom-select-wrapper" id="rankWrapper">
                <div class="custom-select" id="selectedRankTrigger">Выбери звание.</div>
                <div class="custom-options">
                    <div class="custom-option rank-rec" data-value="-0.20">Рекрут (–20%).</div>
                    <div class="custom-option rank-fight" data-value="0.00">Боец.</div>
                    <div class="custom-option rank-off" data-value="0.16">Офицер (+16%).</div>
                    <div class="custom-option rank-sens" data-value="0.24">Сенсей (+24%).</div>
                    <div class="custom-option rank-treas" data-value="0.24">Казначей (+24%).</div>
                    <div class="custom-option rank-grind" data-value="0.24">Гриндер (+24%).</div>
                    <div class="custom-option rank-hero" data-value="0.32">Герой (+32%).</div>
                    <div class="custom-option rank-unknown" data-value="0.00" id="unknownRankOption">Я не знаю своё звание.</div>
                </div>
            </div>
        </div>
        <div class="plate-item" style="flex: 0.9;">
            <label for="trainingValue">Обучение:</label>
            <input type="number" id="trainingValue" value="" placeholder="Введи %." step="0.01" min="0" oninput="calculateExp(false)">
        </div>
    </div>
    <div id="infoNote" class="info-note"></div>
    <div id="unityPlate" class="unity-plate">
        <div class="checkbox-container">
            <input type="checkbox" id="unity" onchange="toggleUnityInput(); calculateExp(false);">
            <label for="unity">Я играю с игроком из клана.</label>
        </div>
        <div class="unity-input-container">
            <label id="unityLabel" for="unityValue">Единство:</label>
            <input type="number" id="unityValue" value="" placeholder="Введи %." step="0.01" min="0" oninput="calculateExp(false)" disabled>
        </div>
    </div>
    <div class="result">
        <div class="result-label">10% от моего опыта, который получит клан:</div>
        <div class="value-container">
            <span id="clanExpResult" class="result-val"></span>
            <svg class="fox-icon" viewBox="0 0 100 100">
                <polygon points="20,50 35,20 45,45" fill="#e67e22" /><polygon points="25,47 35,26 41,45" fill="#d35400" />
                <polygon points="80,50 65,20 55,45" fill="#e67e22" /><polygon points="75,47 65,26 59,45" fill="#d35400" />
                <polygon points="20,50 80,50 50,85" fill="#e67e22" />
                <polygon points="20,50 40,50 50,85" fill="#fff" opacity="0.9" /><polygon points="80,50 60,50 50,85" fill="#fff" opacity="0.9" />
                <circle cx="50" cy="83" r="5" fill="#2c3e50" /><circle cx="40" cy="55" r="4" fill="#2c3e50" /><circle cx="60" cy="55" r="4" fill="#2c3e50" />
                <circle cx="42" cy="53" r="1.5" fill="#fff" /><circle cx="62" cy="53" r="1.5" fill="#fff" />
            </svg>
        </div>
    </div>
    <div class="credits-footer">
        Создано кланом: <span class="clan-name">Ultima Thule</span> © 2026г.<br>
        Для проекта: <span class="project-name">Dead Impact 🧟</span>
    </div>
</div>
<script>
let currentClanBaseSum = 0; let currentSelectedValue = null; let isUnknownActive = false;
const wrapper = document.getElementById('rankWrapper'); const trigger = document.getElementById('selectedRankTrigger');
trigger.addEventListener('click', function() { wrapper.classList.toggle('open'); });
window.addEventListener('click', function(e) { if (!wrapper.contains(e.target)) { wrapper.classList.remove('open'); } });
document.querySelectorAll('.custom-option').forEach(option => {
    option.addEventListener('click', function() {
        trigger.innerText = this.innerText; trigger.className = "custom-select " + this.classList;
        isUnknownActive = (this.id === 'unknownRankOption'); currentSelectedValue = this.getAttribute('data-value'); wrapper.classList.remove('open');
        const b = document.getElementById('baseExp'); const t = document.getElementById('trainingValue');
        const uc = document.getElementById('unity'); const ui = document.getElementById('unityValue');
        if (isUnknownActive) {
            b.disabled = t.disabled = uc.disabled = ui.disabled = true; uc.checked = false; ui.value = "";
            document.getElementById('unityPlate').classList.remove('active'); document.getElementById('unityLabel').classList.remove('active-label');
        } else { b.disabled = false; t.disabled = false; uc.disabled = false; }
        calculateExp(true);
    });
});
function toggleUnityInput() {
    if (isUnknownActive || currentSelectedValue === null) return;
    const uc = document.getElementById('unity').checked; const ui = document.getElementById('unityValue');
    const up = document.getElementById('unityPlate'); const ul = document.getElementById('unityLabel');
    if (uc) { ui.disabled = false; up.classList.add('active'); ul.classList.add('active-label'); }
    else { ui.disabled = true; up.classList.remove('active'); ul.classList.remove('active-label'); ui.value = ""; }
}
function calculateExp(isRankDropdownChanged) {
    const t = document.getElementById('trainingValue'); const res = document.getElementById('clanExpResult'); const inf = document.getElementById('infoNote');
    if (currentSelectedValue === null) {
        res.innerText = ""; inf.innerHTML = `<div class="stat-block"><div class="stat-line" style="justify-content: center; color: #787991;">Для начала укажи своё звание.</div></div>`;
        return;
    }
    if (isUnknownActive) { 
        res.innerText = "Без клана нет и кланового опыта."; res.className = "result-val error-msg";
        inf.innerHTML = `<span class="angry-fox">Если ты не знаешь своё звание, значит ты не в клане. Ведь оно отображается на 1 вкладке клана и его трудно не заметить! 😾</span>`; 
        return; 
    }
    res.className = "result-val";
    if (t.value === "") {
        res.innerText = ""; inf.innerHTML = `<div class="stat-block"><div class="stat-line" style="justify-content: center; color: #787991;">Введи значение «Обучение».</div></div>`;
        if (!isRankDropdownChanged) currentClanBaseSum = 0; return;
    }
    const baseExp = parseFloat(document.getElementById('baseExp').value) || 0; const rankMod = parseFloat(currentSelectedValue);
    const uc = document.getElementById('unity').checked; const unityPercent = parseFloat(document.getElementById('unityValue').value) || 0;
    let totalTrainingPercent = parseFloat(t.value) || 0;
    if (!isRankDropdownChanged) { currentClanBaseSum = totalTrainingPercent / (1 + rankMod); } 
    else { 
        if (currentClanBaseSum === 0 && totalTrainingPercent > 0) { currentClanBaseSum = totalTrainingPercent; }
        totalTrainingPercent = currentClanBaseSum * (1 + rankMod); t.value = totalTrainingPercent.toFixed(2); 
    }
    let expMultiplier = 1 + (totalTrainingPercent / 100); if (uc) { expMultiplier *= (1 + (unityPercent / 100)); }
    const finalClanExp = baseExp * expMultiplier * 0.10;
    res.innerText = Math.round(finalClanExp).toLocaleString('ru-RU', { maximumFractionDigits: 0 });
    const rankBonusAmount = totalTrainingPercent - currentClanBaseSum; const sign = rankMod > 0 ? '+' : '';
    inf.innerHTML = `<div class="stat-block"><div class="stat-line"><span>Базовый бонус клана:</span> <span>${currentClanBaseSum.toFixed(2)}%</span></div><div class="stat-line"><span>Бонус от звания (${sign}${(rankMod * 100).toFixed(0)}%):</span> <span class="${rankMod > 0 ? 'green-val' : (rankMod < 0 ? 'red-val' : '')}">${rankBonusAmount >= 0 ? '+' : ''}${rankBonusAmount.toFixed(2)}%</span></div></div>`;
}
calculateExp(false);
</script>
</body>
</html>
